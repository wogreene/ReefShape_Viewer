<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>3D Reef Viewer</title>
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/style.css"/>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #app {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Caustics toggle (separate from .overlay-toggle so it's always visible
       here, unlike the 2D viewer's conditionally-shown overlay toggle) */
    .caustics-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
      white-space: nowrap;
      cursor: pointer;
    }
    .caustics-toggle input {
      cursor: pointer;
      transform: translateY(1px);
    }

    /* Loading overlay */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 4000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.92);
      color: #fff;
      font-family: "Courier New", Courier, monospace;
      text-align: center;
    }
    #loader[data-hidden="true"] { display: none; }
    #loader[data-state="error"] #loader-message { color: #ffd2d2; }

    #loader-message {
      margin-bottom: 12px;
      font-size: 15px;
    }

    .loader-progress {
      width: 240px;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      overflow: hidden;
      margin: 0 auto;
    }

    #loader-progress-bar {
      width: 100%;
      height: 100%;
      background: #fff;
      transform-origin: left center;
      transform: scaleX(0);
      transition: transform 0.15s linear;
    }
  </style>

  <script>
    // Gate: if user didn't come through splash / has no session password, bounce back
    (function enforcePasswordGate() {
      const pw = (sessionStorage.getItem("reefshape_password") || "").trim();
      if (!pw) {
        window.location.replace("./index.html");
      }
    })();
  </script>
</head>

<body>

  <canvas id="app"></canvas>

  <!-- UI Overlay -->
  <div class="viewer-ui">
    <a class="back-link" href="./index.html">← Back</a>

    <label for="timepointSelect">Time:</label>
    <select id="timepointSelect"></select>

    <label class="caustics-toggle" id="causticsToggleWrap" style="display:none;">
      <input type="checkbox" id="causticsToggle" checked>
      Caustics
    </label>

    <button id="rendererToggle" type="button"></button>
    <button id="vrButton" type="button" style="display:none;">Enter VR</button>
  </div>

  <!-- Loading overlay -->
  <div id="loader" data-hidden="false">
    <div>
      <div id="loader-message">Preparing scene...</div>
      <div class="loader-progress"><div id="loader-progress-bar"></div></div>
    </div>
  </div>

  <!-- Splat viewer logic (PlayCanvas Engine, no build step) -->
  <script type="module" src="js/splat-viewer.js"></script>

</body>
</html>
